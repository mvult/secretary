syntax = "proto3";

package secretary.v1;

option go_package = "github.com/mvult/secretary/backend/gen/secretary/v1;secretaryv1";

import "secretary/v1/persistence.proto";

enum TodoStatus {
  TODO_STATUS_UNSPECIFIED = 0;
  TODO_STATUS_TODO = 1;
  TODO_STATUS_DOING = 2;
  TODO_STATUS_DONE = 3;
  TODO_STATUS_BLOCKED = 4;
  TODO_STATUS_SKIPPED = 5;
}

message Todo {
  int64 id = 1;
  string name = 2;
  string desc = 3;
  TodoStatus status = 4;
  int64 user_id = 5;
  int64 created_at_recording_id = 6;
  int64 updated_at_recording_id = 7;
  string created_at_recording_name = 8;
  string created_at_recording_date = 9;
  string created_at = 10;
  string updated_at = 11;
  string source_kind = 12;
  int64 source_document_id = 13;
  int64 source_block_id = 14;
  string bucket = 15;
  int64 priority_rank = 16;
  string deadline_date = 17;
  int64 goal_id = 18;
  string goal_name = 19;
  int64 current_document_id = 20;
  int64 current_block_id = 21;
  string completed_at = 22;
  int64 completed_document_id = 23;
  int64 completed_block_id = 24;
  int64 workspace_id = 25;
}

message TodoGoal {
  int64 id = 1;
  int64 user_id = 2;
  string name = 3;
  string description = 4;
  string created_at = 5;
  string updated_at = 6;
}

message TodoHistory {
  int64 id = 1;
  int64 todo_id = 2;
  int64 actor_user_id = 3;
  string change_type = 4;
  string name = 5;
  string desc = 6;
  TodoStatus status = 7;
  int64 user_id = 8;
  int64 created_at_recording_id = 9;
  int64 updated_at_recording_id = 10;
  string changed_at = 11;
}

message ListTodosRequest {
  int64 user_id = 1;
  optional int64 recording_id = 2;
}

message ListTodosResponse {
  repeated Todo todos = 1;
}

message GetTodoRequest {
  int64 id = 1;
}

message GetTodoResponse {
  Todo todo = 1;
}

message CreateTodoRequest {
  string name = 1;
  string desc = 2;
  TodoStatus status = 3;
  int64 user_id = 4;
  int64 created_at_recording_id = 5;
  int64 updated_at_recording_id = 6;
  string bucket = 7;
  int64 priority_rank = 8;
  string deadline_date = 9;
  int64 goal_id = 10;
  uint32 protocol_version = 11;
  string mutation_id = 12;
}

message CreateTodoResponse {
  Todo todo = 1;
  string mutation_id = 2;
  DocumentMutationEffects effects = 3;
}

message UpdateTodoRequest {
  int64 id = 1;
  string name = 2;
  string desc = 3;
  TodoStatus status = 4;
  int64 user_id = 5;
  int64 updated_at_recording_id = 6;
  string bucket = 7;
  int64 priority_rank = 8;
  string deadline_date = 9;
  int64 goal_id = 10;
  uint32 protocol_version = 11;
  string mutation_id = 12;
  // Zero selects the authenticated user's receipt scope for an unlinked TODO.
  int64 workspace_id = 13;
  TodoPatch patch = 14;
}

message TodoPatch {
  optional string name = 1;
  optional string desc = 2;
  optional TodoStatus status = 3;
  optional string bucket = 4;
  optional int64 priority_rank = 5;
  optional string deadline_date = 6;
  optional int64 goal_id = 7;
}

message UpdateTodoResponse {
  Todo todo = 1;
  string mutation_id = 2;
  DocumentMutationEffects effects = 3;
}

message DeleteTodoRequest {
  int64 id = 1;
  uint32 protocol_version = 2;
  string mutation_id = 3;
  // Zero selects the authenticated admin's scope for an unlinked TODO.
  int64 workspace_id = 4;
}

message DeleteTodoResponse {
  string mutation_id = 1;
  DocumentMutationEffects effects = 2;
}

message ListTodoHistoryRequest {
  int64 todo_id = 1;
}

message ListTodoHistoryResponse {
  repeated TodoHistory history = 1;
}

message ListTodoGoalsRequest {
  int64 user_id = 1;
}

message ListTodoGoalsResponse {
  repeated TodoGoal goals = 1;
}

message CreateTodoGoalRequest {
  int64 user_id = 1;
  string name = 2;
  string description = 3;
}

message CreateTodoGoalResponse {
  TodoGoal goal = 1;
}

message UpdateTodoGoalRequest {
  int64 id = 1;
  int64 user_id = 2;
  string name = 3;
  string description = 4;
}

message UpdateTodoGoalResponse {
  TodoGoal goal = 1;
}

message DeleteTodoGoalRequest {
  int64 id = 1;
  int64 user_id = 2;
}

message DeleteTodoGoalResponse {}

message MoveDocumentTodosToRepositoryRequest {
  int64 document_id = 1;
  int64 workspace_id = 2;
  uint32 protocol_version = 3;
  string mutation_id = 4;
}

message MoveDocumentTodosToRepositoryResponse {
  int64 moved_count = 1;
  string mutation_id = 2;
  DocumentMutationEffects effects = 3;
}

message PullOnDeckTodosToTodayRequest {
  int64 workspace_id = 1;
  uint32 protocol_version = 2;
  string mutation_id = 3;
  // Required for v1: retain the intended date across retries and midnight.
  string journal_date = 4;
}

message PullOnDeckTodosToTodayResponse {
  int64 pulled_count = 1;
  int64 document_id = 2;
  string mutation_id = 3;
  DocumentMutationEffects effects = 4;
}

message GetTodoCommandContextRequest {
  int64 workspace_id = 1;
}

message GetTodoCommandContextResponse {
  // Server-local calendar date, resolved before retaining a pull request.
  string journal_date = 1;
}

service TodosService {
  rpc GetTodoCommandContext(GetTodoCommandContextRequest) returns (GetTodoCommandContextResponse);
  rpc ListTodos(ListTodosRequest) returns (ListTodosResponse);
  rpc GetTodo(GetTodoRequest) returns (GetTodoResponse);
  rpc CreateTodo(CreateTodoRequest) returns (CreateTodoResponse);
  rpc UpdateTodo(UpdateTodoRequest) returns (UpdateTodoResponse);
  rpc DeleteTodo(DeleteTodoRequest) returns (DeleteTodoResponse);
  rpc ListTodoHistory(ListTodoHistoryRequest) returns (ListTodoHistoryResponse);
  rpc ListTodoGoals(ListTodoGoalsRequest) returns (ListTodoGoalsResponse);
  rpc CreateTodoGoal(CreateTodoGoalRequest) returns (CreateTodoGoalResponse);
  rpc UpdateTodoGoal(UpdateTodoGoalRequest) returns (UpdateTodoGoalResponse);
  rpc DeleteTodoGoal(DeleteTodoGoalRequest) returns (DeleteTodoGoalResponse);
  rpc MoveDocumentTodosToRepository(MoveDocumentTodosToRepositoryRequest) returns (MoveDocumentTodosToRepositoryResponse);
  rpc PullOnDeckTodosToToday(PullOnDeckTodosToTodayRequest) returns (PullOnDeckTodosToTodayResponse);
}
