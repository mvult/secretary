syntax = "proto3";

package secretary.v1;

option go_package = "github.com/mvult/secretary/backend/gen/secretary/v1;secretaryv1";

import "secretary/v1/persistence.proto";

message Block {
  int64 id = 1;
  string client_key = 2;
  int64 document_id = 3;
  int64 parent_block_id = 4;
  string parent_client_key = 5;
  int32 sort_order = 6;
  string text = 7;
  string todo_status = 8;
  int64 todo_id = 9;
  string created_at = 10;
  string updated_at = 11;
}

message Document {
  int64 id = 1;
  string client_key = 2;
  int64 workspace_id = 3;
  string kind = 4;
  string title = 5;
  string journal_date = 6;
  string created_at = 7;
  string updated_at = 8;
  repeated Block blocks = 9;
  int64 directory_id = 10;
  // Positive only for a coherent snapshot served by the versioned protocol.
  // Zero means legacy/unversioned, never a usable update baseline.
  int64 revision = 11;
}

message Directory {
  int64 id = 1;
  int64 workspace_id = 2;
  string name = 3;
  int64 parent_id = 4;
  int32 position = 5;
  string created_at = 6;
  string updated_at = 7;
}

message ListDocumentsRequest {
  int64 workspace_id = 1;
}

message ListDocumentsResponse {
  repeated Document documents = 1;
  repeated Directory directories = 2;
  // Zero until coordinated activation. A client must not infer support from
  // database revisions or attempt to downgrade a retained versioned request.
  uint32 persistence_protocol_version = 3;
}

message GetDocumentRequest {
  int64 id = 1;
}

// Metadata is deliberately not a Document: it cannot be submitted as a body.
message DocumentIndexEntry {
  int64 id = 1;
  string client_key = 2;
  int64 workspace_id = 3;
  string kind = 4;
  string title = 5;
  string journal_date = 6;
  string created_at = 7;
  string updated_at = 8;
  int64 directory_id = 9;
  int64 revision = 10;
  // Only populated for a search; plain text, at most 240 characters.
  string snippet = 11;
}

message ListDocumentIndexRequest {
  int64 workspace_id = 1;
  // Descending immutable ID keyset; zero starts a new traversal.
  int64 before_id = 2;
  int32 page_size = 3;
  // Literal case-insensitive title/body search, preserving native search semantics.
  string query = 4;
}

message ListDocumentIndexResponse {
  repeated DocumentIndexEntry entries = 1;
  int64 next_before_id = 2;
  // Returned on the first page only.
  repeated Directory directories = 3;
  uint32 persistence_protocol_version = 4;
}

message GetDocumentResponse {
  Document document = 1;
}

message SaveDocumentRequest {
  Document document = 1;
  uint32 protocol_version = 2;
  string mutation_id = 3;
  // Presence is required by protocol v1; zero is the create precondition.
  optional int64 expected_revision = 4;
}

enum DocumentSaveOutcome {
  DOCUMENT_SAVE_OUTCOME_UNSPECIFIED = 0;
  DOCUMENT_SAVE_OUTCOME_APPLIED = 1;
  DOCUMENT_SAVE_OUTCOME_EXISTING_JOURNAL = 2;
}

message SaveDocumentResponse {
  Document document = 1;
  string mutation_id = 2;
  DocumentSaveOutcome outcome = 3;
  DocumentMutationEffects effects = 4;
}

message DeleteDocumentRequest {
  int64 id = 1;
  int64 workspace_id = 2;
  uint32 protocol_version = 3;
  string mutation_id = 4;
  optional int64 expected_revision = 5;
}

message DeleteDocumentResponse {
  string mutation_id = 1;
  DocumentMutationEffects effects = 2;
}

message DocumentHistoryEntry {
  int64 id = 1;
  int64 document_id = 2;
  string capture_reason = 3;
  string content_hash = 4;
  string snapshot_json = 5;
  string captured_at = 6;
}

message ListDocumentHistoryRequest {
  int64 document_id = 1;
}

message ListDocumentHistoryResponse {
  repeated DocumentHistoryEntry history = 1;
}

message GetDocumentHistoryEntryRequest {
  int64 id = 1;
}

message GetDocumentHistoryEntryResponse {
  DocumentHistoryEntry history = 1;
}

message CreateDirectoryRequest {
  int64 workspace_id = 1;
  int64 parent_id = 2;
  string name = 3;
}

message CreateDirectoryResponse {
  Directory directory = 1;
}

message UpdateDirectoryRequest {
  int64 id = 1;
  string name = 2;
  int64 parent_id = 3;
  // When present, omitted fields preserve locked current values. Legacy fields
  // must be empty. Explicit parent_id=0 moves the directory to root.
  DirectoryPatch patch = 4;
}

message DirectoryPatch {
  optional string name = 1;
  optional int64 parent_id = 2;
}

message UpdateDirectoryResponse {
  Directory directory = 1;
}

message DeleteDirectoryRequest {
  int64 id = 1;
}

message DeleteDirectoryResponse {}

service DocumentsService {
  rpc ListDocumentIndex(ListDocumentIndexRequest) returns (ListDocumentIndexResponse);
  rpc ListDocuments(ListDocumentsRequest) returns (ListDocumentsResponse);
  rpc GetDocument(GetDocumentRequest) returns (GetDocumentResponse);
  rpc SaveDocument(SaveDocumentRequest) returns (SaveDocumentResponse);
  rpc DeleteDocument(DeleteDocumentRequest) returns (DeleteDocumentResponse);
  rpc ListDocumentHistory(ListDocumentHistoryRequest) returns (ListDocumentHistoryResponse);
  rpc GetDocumentHistoryEntry(GetDocumentHistoryEntryRequest) returns (GetDocumentHistoryEntryResponse);
  rpc CreateDirectory(CreateDirectoryRequest) returns (CreateDirectoryResponse);
  rpc UpdateDirectory(UpdateDirectoryRequest) returns (UpdateDirectoryResponse);
  rpc DeleteDirectory(DeleteDirectoryRequest) returns (DeleteDirectoryResponse);
}
